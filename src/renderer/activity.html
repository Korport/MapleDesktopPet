<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>Maple - Live activity</title>
  <link rel="stylesheet" href="activity.css">
</head>
<body>
  <header>
    <h1>Maple live activity</h1>
    <p>Read-only output from GitHub Copilot, not an interactive terminal.
      Output may pause while tools run; this view does not expose private reasoning.</p>
    <label><input id="follow" type="checkbox" checked> Follow latest output</label>
    <span id="status" role="status">Connecting...</span>
  </header>
  <pre id="output" tabindex="0" aria-label="Live activity output"></pre>
  <script src="activity.js"></script>
</body>
</html>
